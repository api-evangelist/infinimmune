aid: infinimmune
name: Infinimmune
description: 'Infinimmune is a biotechnology company that discovers and engineers human-derived
  antibody therapeutics. Its Complete Human Sequencing and Anthrobody library-on-B-cell platform
  surface rare antibodies that evolution has already proven in people, and its GLIMPSE antibody
  language model characterizes and optimizes candidates in silico for clinical development. Its lead
  program, IFX-101, is an IL-22 inhibitor for moderate-to-severe atopic dermatitis, with additional
  pipeline programs targeting IL-13, APRIL, and IL-17F. Backed by Playground Global. Infinimmune
  publishes no public developer API, SDKs, or machine-readable specifications; this API Evangelist
  profile captures the company identity and its public web, security, and legal surface.'
